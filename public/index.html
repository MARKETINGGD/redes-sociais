<script src="/vendor/jspdf.plugin.autotable.min.js"></script>
<script>
// --- Login único vindo da Plataforma de Gestão de Marketing ---
(function(){
  try{
    var p = new URLSearchParams(location.search);
    var pt = p.get('platformToken');
    var pu = p.get('platformUser');
    if (pt) {
      localStorage.setItem('token', pt);
      if (pu) localStorage.setItem('user', decodeURIComponent(pu));
      p.delete('platformToken'); p.delete('platformUser');
      var clean = location.pathname + (p.toString() ? '?' + p.toString() : '') + location.hash;
      history.replaceState({}, '', clean);
    }
  }catch(e){}
})();
</script>
<script src="/config.js"></script>
<script src="/app.js"></script>
</body>
</html>
