<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard de Resultados — GhelPlus &amp; De Bacco</title>
<script>
// Detecta se esta pagina esta embutida num iframe (a Plataforma de Gestao
// de Marketing abre os dashboards assim) para esconder elementos de chrome
// redundantes (marca/logo e botao Sair) -- a Plataforma ja tem os proprios.
try {
  if (window.top !== window.self) {
    document.documentElement.classList.add("embedded-in-platform");
  }
} catch (e) {
  document.documentElement.classList.add("embedded-in-platform");
}
</script>
<!-- 26a rodada: removido o carregamento de fontes do Google Fonts (Inter /
     IBM Plex Mono) -- agora o CSS usa Arial/Helvetica, a mesma tipografia
     da Plataforma de Gestao de Marketing, entao nao precisa mais buscar
     fonte nenhuma externa. -->
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="/vendor/chart.umd.min.js"></script>
<script src="/vendor/xlsx.full.min.js"></script>
<script src="/vendor/jspdf.umd.min.js"></script>
<script src="/vendor/jspdf.plugin.autotable.min.js"></script>
<script>
// --- Login único vindo da Plataforma de Gestão de Marketing ---
(function(){
  try{
    var p = new URLSearchParams(location.search);
    var pt = p.get('platformToken');
    var pu = p.get('platformUser');
    if (pt) {
      localStorage.setItem('token', pt);
      if (pu) localStorage.setItem('user', decodeURIComponent(pu));
      p.delete('platformToken'); p.delete('platformUser');
      var clean = location.pathname + (p.toString() ? '?' + p.toString() : '') + location.hash;
      history.replaceState({}, '', clean);
    }
  }catch(e){}
})();
</script>
<script src="/config.js"></script>
<script src="/app.js"></script>
</body>
</html>
